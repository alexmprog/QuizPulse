# Serves the Vite build and proxies the API and Socket.IO to the `api` service (same origin, so no CORS).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The bundle compresses to about a third; text/html is always gzipped once gzip is on.
    # text/javascript is what newer nginx mime.types give .js files.
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # Image uploads are capped at 5 MB by the API; leave room for the multipart envelope.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # $http_host keeps the port; the API checks same-origin against it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Hashed build output: cache for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes (/studio/history, /play, /host/:id) serve index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
